# Local development dependencies. Production uses Neon (Postgres 17) and Upstash (Redis).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mealplanner
      POSTGRES_USER: mealplanner
      POSTGRES_PASSWORD: mealplanner
    ports:
      - "5433:5432"  # 5433 on the host to avoid clashing with other local Postgres instances
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealplanner"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
