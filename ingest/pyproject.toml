[project]
name = "mealplanner-ingest"
version = "0.1.0"
description = "Weekly crawler: Aldi Süd food catalogue -> food-only filter -> enrichment -> Postgres catalog schema"
readme = "README.md"
authors = [
    { name = "Bechir Boujelbene", email = "bechirboujlben@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "selectolax>=0.4.12",
    "tenacity>=9.1.4",
]

[project.scripts]
mealplanner-ingest = "mealplanner_ingest:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mealplanner_ingest"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
